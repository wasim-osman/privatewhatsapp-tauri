name: build-test-all

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
            package-glob: 'target/release/bundle/dmg/*.dmg'
          - os: windows-latest
            artifact: windows
            package-glob: 'target/release/bundle/nsis/* target/release/bundle/msi/*'
          - os: ubuntu-latest
            artifact: linux
            package-glob: 'target/release/bundle/appimage/* target/release/bundle/deb/* target/release/bundle/rpm/*'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build release
        run: cargo tauri build

      - name: Smoke test (app runs + heartbeat)
        shell: bash
        run: |
          set -e
          LOG="$(mktemp /tmp/pw-log.XXXXXX)"
          export PW_LOG_PATH="$LOG"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="target/release/privatewhatsapp.exe"
          else
            BIN="target/release/privatewhatsapp"
          fi
          echo "Launching $BIN with PW_LOG_PATH=$LOG"
          if [ "$RUNNER_OS" = "Linux" ]; then
            WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a "$BIN" >/tmp/pw-stdout.log 2>&1 &
          else
            "$BIN" >/tmp/pw-stdout.log 2>&1 &
          fi
          PID=$!
          sleep 45
          kill "$PID" 2>/dev/null || true
          pkill -f privatewhatsapp 2>/dev/null || true
          echo "--- app log:"
          cat "$LOG"
          echo "--- app stdout/stderr:"
          cat /tmp/pw-stdout.log 2>/dev/null || true
          grep -q "page heartbeat received" "$LOG"
          grep -q "window built ok" "$LOG"
          echo "SMOKE PASSED"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*

      - name: Stage packages
        shell: bash
        run: |
          mkdir -p dist-stage
          cp ${{ matrix.package-glob }} dist-stage/ 2>/dev/null || true
          ls -la dist-stage/

      - name: Upload packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-stage/*