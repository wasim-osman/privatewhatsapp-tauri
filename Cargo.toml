[package]
name = "privatewhatsapp"
version = "0.1.0"
edition = "2021"
description = "Text-chat-only WhatsApp Web wrapper built on Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
